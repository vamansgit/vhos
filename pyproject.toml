[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vhos"
version = "2.4.0"
description = "Virtual Hospital Operating System — Graviton Systems"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "redis[hiredis]>=5.0.0",
    "anthropic>=0.28.0",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "aiofiles>=23.2.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "structlog>=24.1.0",
    "orjson>=3.10.0",
    "tenacity>=8.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["agents", "platform", "integrations", "config", "api"]
